e:normal;font-size:12px;color:var(--primary)}.btn{background:var(--paper);color:#525a69;border:1px solid #dfe2ea;border-radius:9px;min-height:36px;padding:7px 13px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .16s,transform .16s}.btn:hover:not(:disabled){background:#f6f5ff}.btn:active:not(:disabled){transform:translateY(1px)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:var(--primary-dark)}.btn.soft{color:var(--primary-dark);background:var(--primary-pale);border-color:#e4e0ff}.btn.soft:hover{background:#e9e6ff}.btn.danger{color:var(--rose);border-color:#f6dce4}.btn.minor{background:transparent;border:0;padding:5px 9px;min-height:28px}.btn.small{padding:5px 10px;min-height:30px;font-size:12px}.btn.icon-btn{padding:6px 9px;min-width:33px}.btn:focus-visible,.nav-row:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b7aafa;outline-offset:2px}.tag{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:650;white-space:nowrap}.tag.review{background:var(--amber-bg);color:var(--amber)}.tag.recent{background:var(--primary-pale);color:var(--primary)}.tag.archived{background:var(--mint-bg);color:var(--mint)}.tag.done{background:#f1f2f4;color:#758090}.tag.caution{background:var(--rose-bg);color:var(--rose)}.section-h{font-size:15px;font-weight:750;margin:0 0 13px}.help{font-size:12px;color:var(--muted);margin:8px 0 0}.input,.textarea,.select{border:1px solid #dfe2e9;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;outline:0}.input:focus,.textarea:focus,.select:focus{border-color:#9b90eb;box-shadow:0 0 0 3px #eeeafe}.textarea{min-height:160px;resize:vertical;line-height:1.8}.form-label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:#515b6a}.form-field+.form-field{margin-top:17px}.empty{border:1px dashed #d7d9e4;border-radius:15px;padding:40px 20px;text-align:center;background:#ffffffa8;color:#7b8492}.empty .emoji{font-size:29px;margin-bottom:8px}.empty strong{display:block;color:#515a6a;font-size:15px}.empty p{margin:6px auto 16px;max-width:440px;font-size:12px}.step{display:flex;gap:13px;align-items:flex-start;padding:13px 0}.step+.step{border-top:1px solid var(--line)}.step-no{height:27px;width:27px;flex:none;display:grid;place-items:center;background:var(--primary-pale);border-radius:9px;color:var(--primary);font-weight:750}.step strong{display:block}.step small{color:var(--muted)}.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:15px}.filter{display:flex;align-items:center;gap:7px}.filter .input{max-width:240px}.info-strip{background:#f8f7fd;border:1px solid #eae7fb;border-radius:11px;padding:10px 14px;color:#766c98;font-size:12px;margin-bottom:16px}.cards{display:flex;flex-direction:column;gap:11px}.event-card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}.event-card.selected{border-color:#9487e9;background:#fbfaff}.event-top{display:flex;gap:11px;align-items:flex-start;padding:15px 15px 10px}.event-body{flex:1;min-width:0}.event-time{font-size:11px;font-weight:700;color:var(--primary);line-height:1.4}.event-title{font-size:14px;font-weight:700;margin-top:3px;line-height:1.5;overflow-wrap:anywhere}.event-actions{padding:0 15px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.event-details{padding:6px 17px 17px 43px;border-top:1px solid #f0eff4;color:#4d5663}.event-detail-line{display:grid;grid-template-columns:42px 1fr;gap:7px;margin-top:9px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.event-detail-line b{color:#968caf;font-weight:700}.check{width:16px;height:16px;accent-color:var(--primary);margin-top:4px;flex:none}.toolbar{position:sticky;top:75px;z-index:7;border:1px solid #dfdafa;background:#f7f5ff;padding:11px 15px;border-radius:1 2{font-size:21px;margin:0 0 5px}.onboard p{font-size:13px;color:#817c99;margin:0 0 15px}.menu-btn{display:none}.statusdot{width:7px;height:7px;background:#3ea985;border-radius:50%;display:inline-block;margin-right:5px}.footer-note{text-align:center;margin-top:40px;color:#a9acb5;font-size:11px}.hide{display:none!important}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">✦</div><div><strong>拾页 · RP 档案</strong><small>WORLD & PRESET STUDIO</small></div></div><div id="archivePicker" class="archive-picker"></div><div id="nav"></div><div class="sidebar-foot"><strong>只保存在你的浏览器中</strong><br>建议定期导出 JSON 备份。更换浏览器或电脑时请导入备份。</div></aside>
  <div class="main"><header class="topbar"><div class="row" style="min-width:0"><button class="btn icon-btn menu-btn" id="openMenu" title="展开导航">☰</button><div class="breadcrumbs">拾页 <span>›</span> <strong id="crumb">概览</strong></div></div><div class="top-actions"><span class="save-state" id="saveState"><span class="statusdot"></span>本地已保存</span><button class="btn small text-btn" id="quickJson">↧ 备份 JSON</button><button class="btn small primary" data-go="paste">＋ 导入剧情</button></div></header><main class="page" id="page" tabindex="-1"></main></div>
</div>
<dialog class="dialog" id="eventDialog"><form id="eventForm"><header><h2 id="eventDialogTitle">编辑事件</h2><button class="btn minor" type="button" data-close="eventDialog" aria-label="关闭">✕</button></header><div class="dialog-body"><input type="hidden" name="id"/><div class="grid"><div class="form-field"><label class="form-label" for="eTime">时间（保留原文）</label><input id="eTime" class="input" name="time" /></div><div class="form-field"><label class="form-label" for="eTitle">事件标题</label><input id="eTitle" class="input" name="title" required maxlength="180" /></div></div><div class="form-field"><label class="form-label" for="eCause">起因</label><textarea class="textarea" id="eCause" name="cause"></textarea></div><div class="form-field"><label class="form-label" for="eProcess">经过</label><textarea class="textarea" id="eProcess" name="process"></textarea></div><div class="form-field"><label class="form-label" for="eResult">结果</label><textarea class="textarea" id="eResult" name="result"></textarea></div></div><footer><button class="btn" type="button" data-close="eventDialog">取消</button><button class="btn primary" type="submit">保存事件</button></footer></form></dialog>
<dialog class="dialog" id="todoDialog"><form id="todoForm"><header><h2 id="todoDialogTitle">编辑待办</h2><button class="btn minor" type="button" data-close="todoDialog">✕</button></header><div class="dialog-body"><input type="hidden" name="id"><div class="form-field"><label class="form-label">类别</label><select name="kind" class="select"><option value="conflict">未解决的矛盾</option><option value="plan">尚未实现的计划／约定</option></select></div><div class="form-field"><label class="form-label">标题</label><input class="input" name="title" required maxlength="180" /></div><div class="form-field"><label class="form-label">内容</label><textarea name="details" class="textarea"></textarea></div></div><footer><button type="button" class="btn" data-close="todoDialog">取消</button><button type="submit" class="btn primary">保存待办</button></footer></form></dialog>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const STORE='shiyer-rp-archive-v1';const UI_STORE='shiyer-rp-ui-v1';const INDEX_STORE='shiyer-rp-archive-index-v2';const DOC_PREFIX='shiyer-rp-document-v2:';const COLLECTION='rp-studio-collection';const COLLECTION_VER=1;const FORMAT='rp-studio-archive';const DELTA='rp-event-delta';const VER=1;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();const uid=()=>('id_'+(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)));
const clone=x=>JSON.parse(JSON.stringify(x));const str=x=>typeof x==='string'?x:(x==null?'':String(x));const readObj=x=>(x&&typeof x==='object'&&!Array.isArray(x))?x:{};
const starting=()=>({format:FORMAT,schemaVersion:VER,documentId:uid(),meta:{title:'我的 RP 世界书',createdAt:now(),updatedAt:now()},world:{settings:{time:'',location:'',lore:''},events:[],todos:[]},preset:{tone:'',style:'',output:{perspective:'',structure:'',format:''},limits:'',special:''},extensions:{}});
function normalizeEvent(v,i){let o=typeof v==='string'?{title:v}:readObj(v);return {...o,id:str(o.id)||uid(),time:str(o.time??o.occurredAt??o.date??''),title:str(o.title??o.name??'未命名事件'),cause:str(o.cause??o.reason??''),process:str(o.process??o.development??o.details??''),result:str(o.result??o.outcome??''),status:['pending','recent','archived'].includes(o.status)?o.status:'archived',order:Number.isFinite(Number(o.order))?Number(o.order):i,createdAt:o.createdAt||now(),updatedAt:o.updatedAt||now()};}
function normalizeTodo(v,i){let o=typeof v==='string'?{title:v}:readObj(v);return {...o,id:str(o.id)||uid(),title:str(o.title??o.name??'待办事项'),details:str(o.details??o.content??''),kind:o.kind==='plan'?'plan':'conflict',status:['pending','open','done'].includes(o.status)?o.status:'open',order:Number.isFinite(Number(o.order))?Number(o.order):i,createdAt:o.createdAt||now(),updatedAt:o.updatedAt||now()};}
function normalizeArchive(src){const input=readObj(src);if(input.format===DELTA)throw new Error('这是“剧情增量更新”文件，请从「导入剧情」处理，而不是覆盖完整存档。');const vers=Number(input.schemaVersion??input.version??1);if(vers>VER)throw new Error('这个存档来自更新版本的工具（v'+vers+'）。为避免丢失内容，请使用新版本打开。');if(input.format&&input.format!==FORMAT)throw new Error('不是可识别的世界书存档格式。');if(!input.world&&!input.worldbook&&!input.preset)throw new Error('找不到 world 或 preset 字段。');
 const base=starting();const w=readObj(input.world??input.worldbook), p=readObj(input.preset);const settings=readObj(w.settings);const op=readObj(p.output);const events=Array.isArray(w.events)?w.events:Array.isArray(w.timeline)?w.timeline:[];const todos=Array.isArray(w.todos)?w.todos:[];
 return {...base,...input,format:FORMAT,schemaVersion:VER,documentId:str(input.documentId)||base.documentId,meta:{...base.meta,...readObj(input.meta)},world:{...base.world,...w,settings:{...base.world.settings,...settings,time:str(settings.time??w.time??''),location:str(settings.location??w.location??''),lore:str(settings.lore??w.lore??w.setting??'')},events:events.map(normalizeEvent),todos:todos.map(normalizeTodo)},preset:{...base.preset,...p,tone:str(p.tone??''),style:str(p.style??''),output:{...base.preset.output,...op,perspective:str(op.perspective??''),structure:str(op.structure??''),format:str(op.format??'')},limits:str(p.limits??''),special:str(p.special??'')}};
}
// 独立档案存储；旧版 STORE 原样保留，不因升级而删除或覆盖。
let data,archiveIndex,persistent=true,loadError='';
const docKey=id=>DOC_PREFIX+id;
const freshIndex=(id,title)=>({format:COLLECTION,schemaVersion:COLLECTION_VER,activeId:id,archives:[{id,title}]});
function validateIndex(v){if(!v||v.format!==COLLECTION||Number(v.schemaVersion)!==COLLECTION_VER||!Array.isArray(v.archives)||!v.archives.length||!v.archives.every(x=>x&&typeof x.id==='string'&&x.id&&!x.id.includes(':'))||new Set(v.archives.map(x=>x.id)).size!==v.archives.length||!v.archives.some(x=>x.id===v.activeId))throw new Error('多档案索引不完整或版本不兼容');return v}
function readStoredArchive(id){const raw=localStorage.getItem(docKey(id));if(raw===null)throw new Error('找不到对应档案的数据：'+id);return normalizeArchive(JSON.parse(raw))}
try{
 const rawIndex=localStorage.getItem(INDEX_STORE);
 if(rawIndex){archiveIndex=validateIndex(JSON.parse(rawIndex));data=readStoredArchive(archiveIndex.activeId)}
 else {const legacy=localStorage.getItem(STORE);data=legacy?normalizeArchive(JSON.parse(legacy)):starting();const id=uid();const idx=freshIndex(id,data.meta.title);localStorage.setItem(docKey(id),JSON.stringify(data));localStorage.setItem(INDEX_STORE,JSON.stringify(idx));archiveIndex=idx}
}catch(e){loadError=e.message||String(e);persistent=false;data=starting();archiveIndex=freshIndex(uid(),data.meta.title);console.error('档案载入失败；已禁止写入，原始存储未被修改',e)}
function setSaveState(ok){persistent=ok;const el=$('#saveState');if(!el)return;if(ok)el.innerHTML='<span class="statusdot"></span>本地已保存';else el.textContent='⚠ 保存失败，请先导出 JSON'}
function writeIndex(index){localStorage.setItem(INDEX_STORE,JSON.stringify(index))}
function archiveTitle(archive){return str(archive.meta?.title).trim()||'未命名世界观'}
function createArchive(archive,label){if(loadError){toast('当前浏览器存档载入异常，已禁用写入');return false}const id=uid();const next={...archiveIndex,activeId:id,archives:[...archiveIndex.archives,{id,title:label||archiveTitle(archive)}]};try{localStorage.setItem(docKey(id),JSON.stringify(archive));try{writeIndex(next)}catch(e){localStorage.removeItem(docKey(id));throw e}}catch(e){setSaveState(false);alert('新档案保存失败，现有档案未被替换：'+e.message);return false}archiveIndex=next;data=archive;afterSwitch();toast('档案已创建并切换：'+archiveTitle(data));return true}
function afterSwitch(){undoArchive=null;selection.clear();preferences.showDetails={};viewSearch='';go('home')}
function switchArchive(id){if(id===archiveIndex.activeId)return;if(loadError)return;let target;try{target=readStoredArchive(id);const next={...archiveIndex,activeId:id};writeIndex(next);archiveIndex=next}catch(e){setSaveState(false);alert('无法切换档案：'+e.message);render();return}data=target;setSaveState(true);afterSwitch()}

function deleteArchive(id){const item=archiveIndex.archives.find(x=>x.id===id);if(!item)return;if(archiveIndex.archives.length===1){toast('请至少保留一个档案；需要空白内容可使用「清空内容」');return}if(!confirm('确定永久删除世界观「'+item.title+'」吗？\n\n只删除这一份档案，不影响其他世界观。此操作无法通过撤销恢复，请先备份 JSON。'))return;const nextIds=archiveIndex.archives.filter(x=>x.id!==id);const nextActive=archiveIndex.activeId===id?nextIds[0].id:archiveIndex.activeId;let target;try{target=nextActive===archiveIndex.activeId?data:readStoredArchive(nextActive);writeIndex({...archiveIndex,activeId:nextActive,archives:nextIds})}catch(e){alert('删除操作未完成：'+e.message);return}archiveIndex={...archiveIndex,activeId:nextActive,archives:nextIds};try{localStorage.removeItem(docKey(id))}catch(e){console.warn('无法清理已删除档案的旧存储',e)}data=target;setSaveState(true);afterSwitch();toast('已删除指定档案')}

function restoreCollection(obj){if(loadError){alert('当前档案索引载入异常，已禁止替换存储');return}if(obj.format!==COLLECTION||Number(obj.schemaVersion)!==COLLECTION_VER||!Array.isArray(obj.archives)||!obj.archives.length)throw new Error('不是可识别的全部档案备份，或集合版本不兼容');if(obj.archives.length>1000)throw new Error('档案数量异常，已拒绝导入');const prepared=obj.archives.map(item=>({sourceId:str(item.id),archive:normalizeArchive(item.archive)}));if(!confirm('将使用备份中的 '+prepared.length+' 个世界观，替换本浏览器现有的 '+archiveIndex.archives.length+' 个世界观。\n\n所有当前本地档案都会从多档案列表移除，且无法撤销。建议先「备份全部档案」。\n\n确定恢复全部吗？'))return;
 const staged=[],nextEntries=[];let newActive='';const oldIds=archiveIndex.archives.map(x=>x.id);
 try{for(let i=0;i<prepared.length;i++){const {archive,sourceId}=prepared[i];const id=uid();localStorage.setItem(docKey(id),JSON.stringify(archive));staged.push(id);nextEntries.push({id,title:archiveTitle(archive)});if(sourceId===obj.activeId)newActive=id}if(!newActive)newActive=staged[0];const idx={format:COLLECTION,schemaVersion:COLLECTION_VER,activeId:newActive,archives:nextEntries};writeIndex(idx);archiveIndex=idx;data=prepared[staged.indexOf(newActive)].archive;for(const id of oldIds)try{localStorage.removeItem(docKey(id))}catch(e){console.warn(e)}setSaveState(true);afterSwitch();toast('已恢复 '+prepared.length+' 个世界观')}catch(e){for(const id of staged)try{localStorage.removeItem(docKey(id))}catch{}throw new Error('恢复失败，旧档案仍然保留：'+e.message)}

function save(){if(loadError){setSaveState(false);return}data.meta.updatedAt=now();try{localStorage.setItem(docKey(archiveIndex.activeId),JSON.stringify(data));const title=archiveTitle(data);const entry=archiveIndex.archives.find(x=>x.id===archiveIndex.activeId);if(entry&&entry.title!==title){const next={...archiveIndex,archives:archiveIndex.archives.map(x=>x.id===entry.id?{...x,title}:x)};writeIndex(next);archiveIndex=next;renderPicker()}setSaveState(true)}catch(e){setSaveState(false);console.error('保存失败',e)}}

function navItem(item,depth=0){let kids=Array.isArray(item.children)&&item.children.length;const hasActive=kids&&item.children.some(x=>x.id===current||(x.children||[]).some(y=>y.id===current));const opened=preferences.expanded[item.id]!==false;let countVal=count(item.id);let html=`<button type="button" class="nav-row ${current===item.id?'active':''}" ${kids?'data-expand="'+esc(item.id)+'"':'data-go="'+esc(item.id)+'"'} aria-expanded="${kids?opened:'false'}"><span style="width:${depth?7:17}px;text-align:center">${depth?'·':esc(item.icon||'▸')}</span><span class="label">${esc(item.title)}</span>${countVal?`<span class="count">${countVal}</span>`:''}${kids?`<span class="nav-arrow ${opened?'open':''}">▶</span>`:''}</button>`;if(kids&&opened)html+=`<div class="nav-children">${item.children.map(x=>navItem(x,depth+1)).join('')}</div>`;return html}

function parseDate(t){let s=str(t);let yr=s.match(/(?:^|[^\d])([1-9]\d{3})\s*年/),mo=s.match(/(?:^|[^\d])(1[0-2]|0?[1-9])\s*月/),dy=s.match(/(?:月|\s)(3[01]|[12]\d|0?[1-9])\s*[日号]/);if(/\d{4}\s*[-—～~至]\s*\d{4}\s*年/.test(s))yr=null;return {y:yr?+yr[1]:null,m:mo?+mo[1]:null,d:dy?+dy[1]:null}}
function timeSort(a,b){const aa=parseDate(a.time),bb=parseDate(b.time);if(aa.y!==null&&bb.y!==null&&aa.y!==bb.y)return aa.y-bb.y;if(aa.m!==null&&bb.m!==null&&(aa.y===bb.y||aa.y===null||bb.y===null)&&aa.m!==bb.m)return aa.m-bb.m;if(aa.y!==null&&bb.y===null)return -1;if(aa.y===null&&bb.y!==null)return 1;if(aa.m!==null&&bb.m===null)return -1;if(aa.m===null&&bb.m!==null)return 1;if(aa.d!==null&&bb.d!==null&&aa.d!==bb.d)return aa.d-bb.d;return (a.order??0)-(b.order??0)}
function listEvents(status){let list=data.world.events.filter(x=>status==='timeline'?x.status!=='pending':status==='recent'?x.status==='recent':x.status==='pending');if(viewSearch){const q=viewSearch.toLowerCase();list=list.filter(x=>[x.title,x.time,x.cause,x.process,x.result].some(t=>str(t).toLowerCase().includes(q)))}return [...list].sort(preferences.sort==='time'?timeSort:(a,b)=>a.order-b.order)}

function eventResults(type){let cards=listEvents(type);const msg=type==='review'?'没有待审核事件':'还没有事件';const extra=type==='review'?'<button class="btn primary" data-go="paste">去粘贴 AI 总结</button>':'<button class="btn" data-action="new-event">＋ 手动添加一条</button>';return selectbar('event')+(cards.length?`<div class="row between wrap" style="margin:0 0 10px"><span class="muted">${cards.length} 条事件</span><button class="btn minor small" data-action="toggle-all-details">${cards.every(e=>preferences.showDetails[e.id])?'全部收起':'全部展开'}</button></div><div class="cards">${cards.map(eventCard).join('')}</div>`:empty('◇',msg,'从 AI 导入，或者自己随手记一条。',extra))}
function todoCards(state){const all=data.world.todos.filter(x=>x.status===state).sort((a,b)=>a.order-b.order);if(!all.length)return empty('✓',state==='pending'?'没有待审核待办':'暂时没有待办','有未解决的矛盾或未实现的计划时，再来记录。');return `<div class="cards">${all.map(t=>`<div class="surface todo-card" data-todo="${esc(t.id)}"><div class="row" style="align-items:flex-start"><input type="checkbox" class="check" data-select-todo="${esc(t.id)}" ${selection.has(t.id)?'checked':''}><div style="flex:1;min-width:0"><div class="row wrap"><strong style="overflow-wrap:anywhere">${esc(t.title)}</strong><span class="tag ${t.status==='pending'?'review':t.status==='done'?'done':'recent'}">${t.status==='pending'?'待审核':t.status==='done'?'已完成':t.kind==='plan'?'计划／约定':'未解决矛盾'}</span></div>${t.details?`<div class="todo-content">${esc(t.details)}</div>`:''}</div></div><div class="row wrap" style="margin-top:10px"><button class="btn small" data-action="edit-todo" data-id="${esc(t.id)}">✎ 修改</button>${t.status==='pending'?`<button class="btn small primary" data-action="approve-todo" data-id="${esc(t.id)}">✓ 审核通过</button>`:''}${t.status==='open'?`<button class="btn small soft" data-action="finish-todo" data-id="${esc(t.id)}">✓ 标记完成</button>`:''}${t.status==='done'?`<button class="btn small" data-action="reopen-todo" data-id="${esc(t.id)}">恢复进行中</button>`:''}<button class="btn small minor" style="color:var(--rose)" data-action="delete-todo" data-id="${esc(t.id)}">删除</button></div></div>`).join('')}</div>`}
function todosView(){return heading('待办事项','尚未解决的矛盾、尚未实现的计划与约定，统一收在这里。','WORLD BOOK')+`<div class="bar"><button class="btn primary" data-action="new-todo">＋ 添加待办</button><div class="row wrap"><span class="tag recent">进行中 ${data.world.todos.filter(x=>x.status==='open').length}</span><span class="tag done">已完成 ${data.world.todos.filter(x=>x.status==='done').length}</span></div></div><h3 class="section-h">进行中</h3>${selectbar('todo')}${todoCards('open')}<h3 class="section-h" style="margin-top:24px">已完成（可展开保留）</h3><details class="surface pad"><summary style="cursor:pointer">查看已完成待办 ${data.world.todos.filter(x=>x.status==='done').length} 项</summary><div style="margin-top:16px">${todoCards('done')}</div></details>`}
function pastePage(){return heading('剧情快速更新','复制 AI 的总结并粘贴，自动变成事件卡片。先审核，再正式收录。','QUICK CAPTURE')+`<div class="grid"><section class="surface pad"><h3 class="section-h">① 粘贴 AI 的整理结果</h3><textarea class="textarea" id="pasteText" style="min-height:345px" spellcheck="false"></textarea><div class="row wrap" style="margin-top:13px"><button class="btn primary" data-action="parse-delta">✦ 生成待审核卡片</button><button class="btn" data-action="plain-to-card">按普通文本保存草稿</button></div><div id="parseMessage" style="margin-top:14px"></div></section><section class="stack"><div class="surface pad"><h3 class="section-h">② 想让旧窗口 AI 一次整理好？</h3><p class="muted" style="font-size:12px">工具提供配套 Prompt：只整理起因、经过、结果，单独提取待办，不推断以后会怎么样。</p><button class="btn soft" data-action="copy-prompt">复制专用 Prompt</button><button class="btn minor" data-go="prompt">先看看内容 →</button></div><div class="surface pad"><h3 class="section-h">③ 更新后做什么？</h3><div class="step"><span class="step-no">1</span><div><strong>自动生成卡片</strong><small>每一条事件独立保存为待审核。</small></div></div><div class="step"><span class="step-no">2</span><div><strong>检查并修改错误</strong><small>支持单条通过，也支持批量审核。</small></div></div><div class="step"><span class="step-no">3</span><div><strong>归档和备份</strong><small>审核后的卡片进入最近事件，日后批量归档；导出 JSON 正式备份。</small></div></div></div></section></div>`}
function promptText(){return `你是 RP 聊天记录整理助手。请只回顾【当前聊天窗口中实际发生的新剧情】，生成可以导入存档工具的增量记录。\n\n【筛选和表述】\n1. 按发生的先后顺序整理值得保留的事件。每条事件只记录：时间原文、标题、起因、经过、结果。尽量具体、准确、紧凑；必要时多写几句，不要为压缩篇幅遗漏关键情节。\n2. 不要分析事件对以后剧情的影响；不要预测未来发展，不擅自补全角色心理或动机。不要把角色的猜测、玩笑或计划写成既成事实。\n3. 时间不清楚时保留模糊说法（如“10月中旬”“某天”“协作营结束后”），绝不能编造具体日期；无法确认就填空字符串。\n4. 尚未解决的矛盾、尚未实现的计划或约定，放进 todos，不要另写后续发展预测。已经解决或已完成的事项不列入 todos。\n5. 不要照搬世界书里已有的远期历史；只整理当前窗口新增的剧情。事件按时间顺序排列。\n6. 不要追求每件小事都存档，无关紧要的日常细节可以略过。\n7. 仅输出一个合法的 JSON 对象；不得附解释、注释、Markdown 代码围栏、尾随逗号。所有值使用合法 JSON 字符串；没有信息的字段填 ""；没有项目则用 []。\n\n【必须遵守的 JSON 结构】\n{\n  "format": "rp-event-delta",\n  "version": 1,\n  "events": [\n    {\n      "time": "xxxx年xx月xx日",\n      "title": "事件标题",\n      "cause": "事件起因",\n      "process": "事情经过",\n      "result": "已经发生的结果"\n    }\n  ],\n  "todos": [\n    {\n      "kind": "conflict",\n      "title": "尚未解决的矛盾",\n      "details": "当前客观状态"\n    },\n    {\n      "kind": "plan",\n      "title": "尚未实现的计划或约定",\n      "details": "目前确认的安排"\n    }\n  ]\n}\n\nkind 只能是 conflict（未解决矛盾）或 plan（未实现计划／约定）。示例文字仅说明格式，不要作为真实剧情输出。`}

function archivesPage(){const items=archiveIndex.archives.map(x=>`<section class="surface archive-item ${x.id===archiveIndex.activeId?'current':''}"><div><strong>${esc(x.title||'未命名世界观')}</strong>${x.id===archiveIndex.activeId?'<span class="tag recent" style="margin-left:9px">当前档案</span>':''}<div class="help">${x.id===archiveIndex.activeId?'正在编辑中':'独立保存于此浏览器'}</div></div><div class="row">${x.id===archiveIndex.activeId?'':`<button class="btn small soft" data-action="switch-archive" data-id="${esc(x.id)}">切换</button>`}<button class="btn small" data-action="rename-archive" data-id="${esc(x.id)}">重命名</button><button class="btn small danger" data-action="delete-archive" data-id="${esc(x.id)}" ${archiveIndex.archives.length===1?'disabled':''}>删除</button></div></section>`).join('');return heading('档案管理','每个世界观独立保存世界书、事件、待办与预设。可在左侧随时切换。','ARCHIVE MANAGER')+`<div class="bar"><button class="btn primary" data-action="new-archive">＋ 新建空白世界观</button><button class="btn" data-go="files">备份 / 清空内容 →</button></div><div class="archive-list">${items}</div><div class="notice" style="margin-top:20px">删除档案与清空内容不同：删除会移除整个世界观；清空只对当前档案选中的模块生效。所有数据默认只保存在此浏览器中。</div>`}
function clearArchive(){const labels={settings:'世界设定',events:'全部剧情事件',todos:'全部待办事项',preset:'预设正文'};const chosen=Array.from(document.querySelectorAll('[data-clear-kind]:checked')).map(x=>x.dataset.clearKind);if(!chosen.length){toast('请先选择需要清空的内容');return}const name=archiveTitle(data);if(!confirm('仅清空当前世界观「'+name+'」中的：\n'+chosen.map(x=>'· '+labels[x]).join('\n')+'\n\n其他世界观完全不受影响。此操作无法跨会话撤销，请确认已备份需要保留的内容。\n\n确定清空吗？'))return;snapshot();if(chosen.includes('settings'))for(const k of ['time','location','lore'])data.world.settings[k]='';if(chosen.includes('events'))data.world.events=[];if(chosen.includes('todos'))data.world.todos=[];if(chosen.includes('preset')){for(const k of ['tone','style','limits','special'])data.preset[k]='';for(const k of ['perspective','structure','format'])data.preset.output[k]=''}selection.clear();if(chosen.includes('events'))preferences.showDetails={};save();render();toast('已清空当前档案选中的内容（其他世界观未改变）')}
function filesPage(){return heading('导入 / 导出','JSON 可以恢复编辑；Markdown 用于阅读或发送给 AI。','DATA & BACKUP')+`<div class="grid"><section class="surface doc-box"><h3 class="section-h">当前世界观 · JSON</h3><p>只备份「${esc(archiveTitle(data))}」，保持旧版单档案 JSON 格式。导入单档案会新增一份世界观，不覆盖已有档案。</p><div class="doc-actions"><button class="btn primary" data-action="export-json">↓ 导出当前 JSON</button><button class="btn" data-action="import-json">↑ 导入单个档案</button></div><input type="file" id="jsonFile" accept=".json,application/json" class="hide"><div class="help">当前结构版本：v${VER} · 文档 ID：${esc(data.documentId)}</div></section><section class="surface doc-box"><h3 class="section-h">全部世界观 · 集合备份</h3><p>把 ${archiveIndex.archives.length} 个世界观一起导出，方便更换浏览器。恢复全部会替换当前浏览器内的所有多档案。</p><div class="doc-actions"><button class="btn primary" data-action="export-all">↓ 备份全部档案</button><button class="btn" data-action="import-all">↑ 恢复全部档案</button></div><input type="file" id="collectionFile" accept=".json,application/json" class="hide"><div class="help">集合备份仅适用于支持多档案的拾页版本。</div></section><section class="surface doc-box"><h3 class="section-h">Markdown 阅读版</h3><p>只导出当前世界观。最近事件与已归档时间线分开列出，不重复事件。</p><div class="doc-actions"><button class="btn primary" data-action="export-md">↓ 导出 Markdown</button><button class="btn" data-action="preview-md">预览内容</button></div></section><section class="surface doc-box"><h3 class="section-h">旧存档与兼容性</h3><p>旧版 JSON 导入后，原有字段恢复到相应模块；旧文件没有的新字段保持空白。导入更新版本且无法识别的文件会拒绝覆盖。</p><p>如果新版能够读取同一存储空间中的旧拾页数据，会自动迁移并保留旧数据；如浏览器对不同 HTML 文件隔离存储，请直接导入旧版导出的 JSON。</p></section></div><section class="surface pad" style="margin-top:20px"><h3 class="section-h">清空当前世界观内容</h3><p class="muted" style="font-size:12px">只针对正在使用的「${esc(archiveTitle(data))}」，不会清空其他世界观。模块标题和功能说明始终保留。</p><label class="clear-option"><input type="checkbox" data-clear-kind="settings" checked><span><strong>世界设定</strong> · 时间与历法、地点、背景</span></label><label class="clear-option"><input type="checkbox" data-clear-kind="events" checked><span><strong>剧情事件</strong> · 长期时间线、最近事件、待审核事件</span></label><label class="clear-option"><input type="checkbox" data-clear-kind="todos" checked><span><strong>待办事项</strong> · 所有状态的待办</span></label><label class="clear-option"><input type="checkbox" data-clear-kind="preset"><span><strong>RP 预设正文</strong> · 语气、文风、输出要求、禁忌等（默认不选）</span></label><div class="divider"></div><button class="btn danger" data-action="clear-archive">清空勾选的内容</button><p class="help">清空只修改当前档案的字段，不会删除档案本身。重要剧情建议先导出 JSON 备份。</p></section><div class="notice" style="margin-top:19px">⚠ 本地自动保存不等于文件备份。清理浏览器数据或更换设备前，请导出 JSON；恢复全部档案会替换本浏览器现有的档案列表。</div><div id="mdPreview" style="margin-top:18px"></div>`}
function mdEscape(s){return str(s).replace(/\\/g,'\\\\').replace(/\r/g,'').trim()}
function markdown(){let w=data.world.settings,p=data.preset,arch=[...data.world.events].filter(e=>e.status==='archived').sort(timeSort),rec=[...data.world.events].filter(e=>e.status==='recent').sort(timeSort),todo=data.world.todos.filter(e=>e.status==='open').sort((a,b)=>a.order-b.order);let o=[`# ${mdEscape(data.meta.title)||'世界书与预设'}`,'','## 世界书','','### 世界设定','','#### 时间与历法','',mdEscape(w.time)||'（未填写）','','#### 地点','',mdEscape(w.location)||'（未填写）','','#### 世界设定','',mdEscape(w.lore)||'（未填写）','','### 长期时间线'];function putEvent(e){o.push('',`#### ${mdEscape(e.time||'时间未标明')} · ${mdEscape(e.title)}`,'',`- 起因：${mdEscape(e.cause)||'—'}`,`- 经过：${mdEscape(e.process)||'—'}`,`- 结果：${mdEscape(e.result)||'—'}`)}if(!arch.length)o.push('','（暂无已归档事件）');arch.forEach(putEvent);o.push('','### 最近事件');if(!rec.length)o.push('','（暂无最近事件）');rec.forEach(putEvent);o.push('','### 待办事项');if(!todo.length)o.push('','（暂无待办）');todo.forEach(t=>o.push('',`- **[${t.kind==='plan'?'计划／约定':'未解决矛盾'}] ${mdEscape(t.title)}**${t.details?'：'+mdEscape(t.details):''}`));o.push('','## 预设');for(const [n,v] of [['语气 / 基调',p.tone],['文风',p.style],['输出格式 · 叙述视角',p.output.perspective],['输出格式 · 回复结构',p.output.structure],['输出格式 · 格式要求',p.output.format],['禁忌 / 限制',p.limits],['特殊响应',p.special]])o.push('',`### ${n}`,'',mdEscape(v)||'（未填写）');return o.join('\n')+'\n'}
function render(){if(loadError){$('#page').innerHTML=heading('无法安全读取原有存档','检测到本地数据或多档案索引异常。为防止覆盖旧数据，本次已禁止写入。请优先用旧版本备份原文件，再排查浏览器存储。')+`<div class="notice error">${esc(loadError)}</div>`;$('#saveState').textContent='⚠ 载入异常，禁止写入';return}if(!locate(current))current='home';renderPicker();renderNav();$('#crumb').textContent=locate(current)?.title||'概览';let html;if(current==='home')html=home();else if(bindings[current])html=editor(current);else if(['timeline','recent','review'].includes(current))html=renderEventView(current);else if(current==='todos')html=todosView();else if(current==='paste')html=pastePage();else if(current==='prompt')html=promptPage();else if(current==='files')html=filesPage();else if(current==='archives')html=archivesPage();else{current='home';html=home()}$('#page').innerHTML=html+`<div class="footer-note">拾页 · 一个安静的 RP 存档角落 · 离线可用</div>`;if(!persistent)$('#saveState').textContent='⚠ 请导出 JSON 备份'}
function download(name,textContent,mime){const blob=new Blob([textContent],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function filename(ext){const title=str(data.meta.title).trim().replace(/[\\/:*?"<>|]+/g,'_').slice(0,45)||'RP存档';return title+'_'+new Date().toISOString().slice(0,10)+'.'+ext}

async function copyPrompt(){const txt=promptText();try{await navigator.clipboard.writeText(txt);toast('Prompt 已复制，发到旧窗口即可')}catch{let ta=$('#promptBox');if(!ta){go('prompt');ta=$('#promptBox')}ta.focus();ta.select();try{if(document.execCommand('copy'))toast('Prompt 已复制');else toast('请选中文本并手动复制')}catch{toast('无法自动复制，请选中文本手动复制')}}}
function stripFence(s){let txt=s.trim().replace(/^\uFEFF/,'');const fence=txt.match(/^```(?:json|JSON)?\s*([\s\S]*?)\s*```\s*$/);if(fence)txt=fence[1].trim();return txt}
function removeTrailingCommas(s){let result='',quoted=false,escaped=false;for(let i=0;i<s.length;i++){const c=s[i];if(quoted){result+=c;if(escaped)escaped=false;else if(c==='\\')escaped=true;else if(c==='"')quoted=false;continue}if(c==='"'){quoted=true;result+=c;continue}if(c===','){let j=i+1;while(j<s.length&&/\s/.test(s[j]))j++;if(s[j]===']'||s[j]==='}')continue}result+=c}return result}
function parseJSON(s){const t=stripFence(s);const tries=[t,removeTrailingCommas(t)];const start=t.indexOf('{'),end=t.lastIndexOf('}');if(start>=0&&end>start&&t!==t.slice(start,end+1)){const sn=t.slice(start,end+1);tries.push(sn,removeTrailingCommas(sn))}for(const candidate of tries){try{return JSON.parse(candidate)}catch{}}throw new Error('JSON 无法读取。请让 AI “只修复 JSON 格式，不要改动剧情”；或用「按普通文本保存草稿」。')}
function parseDelta(value){let obj=readObj(value);if(obj.format&&obj.format!==DELTA)throw new Error('这段 JSON 不是剧情增量格式，请检查是否粘贴了完整世界书备份。');if(!obj.format&&!Array.isArray(obj.events)&&!Array.isArray(obj.todos))throw new Error('没有找到 events 或 todos 列表。');if(obj.version&&Number(obj.version)>1)throw new Error('增量格式版本高于当前工具。');let ev=Array.isArray(obj.events)?obj.events:[],to=Array.isArray(obj.todos)?obj.todos:[];const validE=ev.filter(x=>x&&typeof x==='object'&&(x.title||x.process||x.cause||x.result));const validT=to.filter(x=>x&&typeof x==='object'&&(x.title||x.details));if(!validE.length&&!validT.length)throw new Error('没有可导入的事件或待办，请检查 AI 的输出。');snapshot();let base=Math.max(0,...data.world.events.map(e=>Number(e.order)||0))+1;for(const raw of validE){let e=normalizeEvent(raw,base++);e.id=uid();e.status='pending';data.world.events.push(e)}base=Math.max(0,...data.world.todos.map(e=>Number(e.order)||0))+1;for(const raw of validT){let t=normalizeTodo(raw,base++);t.id=uid();t.status='pending';data.world.todos.push(t)}save();render();toast(`已生成 ${validE.length} 张事件卡片及 ${validT.length} 条待办，等待审核`);go('review')}
function action(a,id){if(a==='new-archive'){newArchive();return}if(a==='switch-archive'){switchArchive(id);return}if(a==='rename-archive'){renameArchive(id);return}if(a==='delete-archive'){deleteArchive(id);return}if(a==='clear-archive'){clearArchive();return}if(a==='export-all'){exportCollection();return}if(a==='import-all'){$('#collectionFile')?.click();return}let es=data.world.events,ts=data.world.todos,e=es.find(x=>x.id===id),t=ts.find(x=>x.id===id);
 if(a==='new-event'){openEvent();return}if(a==='new-todo'){openTodo();return}if(a==='edit-event'&&e){openEvent(e);return}if(a==='edit-todo'&&t){openTodo(t);return}
 if(a==='toggle-detail'&&e){preferences.showDetails[id]=!preferences.showDetails[id];render();return}
 if(a==='toggle-all-details'){const list=listEvents(current),show=!list.every(x=>preferences.showDetails[x.id]);for(const item of list)preferences.showDetails[item.id]=show;render();return}
 if(a==='clear-selection'){selection.clear();render();return}if(a==='undo'){undo();return}
 if(a==='approve-event'&&e){snapshot();e.status='recent'}else if(a==='archive-event'&&e){snapshot();e.status='archived'}else if(a==='return-event'&&e){snapshot();e.status='recent'}else if(a==='delete-event'&&e){if(!confirm('确定删除这条事件吗？此操作可通过「撤销上一步」恢复。'))return;snapshot();data.world.events=es.filter(x=>x.id!==id);selection.delete(id)}
 else if(a==='approve-todo'&&t){snapshot();t.status='open'}else if(a==='finish-todo'&&t){snapshot();t.status='done'}else if(a==='reopen-todo'&&t){snapshot();t.status='open'}else if(a==='delete-todo'&&t){if(!confirm('确定删除这条待办吗？'))return;snapshot();data.world.todos=ts.filter(x=>x.id!==id);selection.delete(id)}
 else if(a==='move-up'||a==='move-down'){if(!e)return;let full=[...data.world.events].sort(preferences.sort==='time'?timeSort:(a,b)=>a.order-b.order),visible=listEvents(current),index=visible.findIndex(x=>x.id===id),target=index+(a==='move-up'?-1:1);if(index<0||target<0||target>=visible.length){toast('已到可见列表的边界');return}snapshot();[visible[index],visible[target]]=[visible[target],visible[index]];const visibleIds=new Set(visible.map(x=>x.id)),iter=visible[Symbol.iterator]();const newOrder=full.map(x=>visibleIds.has(x.id)?iter.next().value:x);newOrder.forEach((x,i)=>x.order=i);preferences.sort='manual';persistUI()}
 else if(a==='bulk-review'){const chosen=es.filter(x=>selection.has(x.id)&&x.status==='pending');if(!chosen.length)return;snapshot();chosen.forEach(x=>x.status='recent');selection.clear()}
 else if(a==='bulk-archive'){const chosen=es.filter(x=>selection.has(x.id)&&x.status==='recent');if(!chosen.length)return;snapshot();chosen.forEach(x=>x.status='archived');selection.clear()}
 else if(a==='archive-all-recent'){let all=es.filter(x=>x.status==='recent');if(!all.length){toast('没有需要归档的最近事件');return}if(!confirm('确认归档全部 '+all.length+' 条最近事件？事件会继续保留在长期时间线。'))return;snapshot();all.forEach(x=>x.status='archived');selection.clear()}
 else if(a==='bulk-review-todos'||a==='review-all-todos'){const chosen=ts.filter(x=>x.status==='pending'&&(a==='review-all-todos'||selection.has(x.id)));if(!chosen.length){toast('没有待审核待办');return}snapshot();chosen.forEach(x=>x.status='open');selection.clear()}
 else if(a==='bulk-finish-todos'){const chosen=ts.filter(x=>selection.has(x.id)&&x.status==='open');if(!chosen.length)return;snapshot();chosen.forEach(x=>x.status='done');selection.clear()}
 else if(a==='parse-delta'){let txt=$('#pasteText')?.value.trim();if(!txt){toast('先粘贴旧窗口 AI 的总结');return}try{parseDelta(parseJSON(txt))}catch(err){$('#parseMessage').innerHTML=`<div class="notice error">${esc(err.message)}</div>`}return}
 else if(a==='plain-to-card'){let txt=$('#pasteText')?.value.trim();if(!txt){toast('先粘贴一些文本');return}snapshot();const firstLine=txt.split(/\n+/).find(x=>x.trim())?.trim()||'未命名事件';const title=firstLine.slice(0,80);data.world.events.push(normalizeEvent({time:'',title,cause:'',process:txt,result:'',status:'pending',order:nextOrder(es)},nextOrder(es)));save();go('review');toast('文本已保存为一张待审核草稿');return}
 else if(a==='copy-prompt'){copyPrompt();return}else if(a==='export-json'){exportJSON();return}else if(a==='export-md'){download(filename('md'),markdown(),'text/markdown;charset=utf-8');toast('Markdown 阅读版已生成');return}else if(a==='import-json'){$('#jsonFile')?.click();return}else if(a==='preview-md'){const box=$('#mdPreview');if(box)box.innerHTML=`<div class="surface pad"><div class="row between"><h3 class="section-h" style="margin:0">Markdown 内容预览</h3>${button('export-md','导出 Markdown','soft')}</div><pre class="codepreview">${esc(markdown())}</pre></div>`;return}
 else {return}save();render()}
function nextOrder(items){return Math.max(0,...items.map(x=>Number(x.order)||0))+1}
function openEvent(e){const f=$('#eventForm');f.reset();f.elements.id.value=e?.id||'';for(const key of ['time','title','cause','process','result'])f.elements[key].value=str(e?.[key]||'');$('#eventDialogTitle').textContent=e?'修改事件卡片':'新建事件卡片';$('#eventDialog').showModal();setTimeout(()=>f.elements.title.focus(),10)}
function openTodo(t){const f=$('#todoForm');f.reset();f.elements.id.value=t?.id||'';for(const key of ['title','details'])f.elements[key].value=str(t?.[key]||'');f.elements.kind.value=t?.kind||'conflict';$('#todoDialogTitle').textContent=t?'修改待办':'新建待办';$('#todoDialog').showModal();setTimeout(()=>f.elements.title.focus(),10)}
$('#eventForm').addEventListener('submit',ev=>{ev.preventDefault();let f=ev.currentTarget,id=f.elements.id.value,old=data.world.events.find(x=>x.id===id);snapshot();const value={time:f.elements.time.value,title:f.elements.title.value.trim(),cause:f.elements.cause.value,process:f.elements.process.value,result:f.elements.result.value};if(old)Object.assign(old,value,{updatedAt:now()});else data.world.events.push(normalizeEvent({...value,status:'pending',order:nextOrder(data.world.events)},nextOrder(data.world.events)));$('#eventDialog').close();save();render();toast(old?'事件修改已保存':'已新增待审核事件')});
$('#todoForm').addEventListener('submit',ev=>{ev.preventDefault();let f=ev.currentTarget,id=f.elements.id.value,old=data.world.todos.find(x=>x.id===id);snapshot();let value={title:f.elements.title.value.trim(),details:f.elements.details.value,kind:f.elements.kind.value};if(old)Object.assign(old,value,{updatedAt:now()});else data.world.todos.push(normalizeTodo({...value,status:'open',order:nextOrder(data.world.todos)},nextOrder(data.world.todos)));$('#todoDialog').close();save();render();toast('待办已保存')});
function readFile(file,kind='single'){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const obj=JSON.parse(fr.result);if(kind==='collection'){restoreCollection(obj);return}if(obj.format===COLLECTION)throw new Error('这是全部档案集合，请使用「恢复全部档案」。');if(obj.format===DELTA){parseDelta(obj);return}const archive=normalizeArchive(obj);if(!confirm('将把 JSON 中的「'+archiveTitle(archive)+'」添加为一个新的独立世界观。\n\n原有档案不会被覆盖，是否继续？'))return;createArchive(archive,archiveTitle(archive))}catch(err){toast('导入失败：'+err.message);alert('无法导入：'+err.message)}};fr.onerror=()=>toast('文件读取失败');fr.readAsText(file,'UTF-8')}
$('#archivePicker').addEventListener('change',e=>{if(e.target.id==='activeArchive')switchArchive(e.target.value)});
$('#archivePicker').addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-action]');if(!b)return;if(b.dataset.go)go(b.dataset.go);else action(b.dataset.action,b.dataset.id)});
$('#page').addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-action]');if(!b)return;if(b.dataset.go)go(b.dataset.go);else action(b.dataset.action,b.dataset.id)});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-expand]');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.expand){let key=b.dataset.expand;preferences.expanded[key]=preferences.expanded[key]===false;persistUI();renderNav()}});
$('#page').addEventListener('input',e=>{const input=e.target;if(input.dataset.bind){assignPath(input.dataset.bind,input.value);const count=input.closest('section')?.querySelector('.muted[style*="font-size:11px"]');if(count)count.textContent=input.value.length+' 字'}if(input.id==='eventSearch'){viewSearch=input.value;const box=$('#eventResults');if(box)box.innerHTML=eventResults(current)}});
$('#page').addEventListener('change',e=>{const t=e.target;if(t.id==='sortMode'){preferences.sort=t.value;persistUI();render()}if(t.dataset.selectEvent||t.dataset.selectTodo){let id=t.dataset.selectEvent||t.dataset.selectTodo;t.checked?selection.add(id):selection.delete(id);render()}if(t.id==='jsonFile'){readFile(t.files[0],'single');t.value=''}if(t.id==='collectionFile'){readFile(t.files[0],'collection');t.value=''}});
$('#page').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='eventSearch')e.preventDefault()});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).close()));$('#openMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('mobile-open'));$('#quickJson').addEventListener('click',exportJSON);document.querySelector('.topbar').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();exportJSON()}});
render();
})();
</script>
</body>
